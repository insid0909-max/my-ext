          P.search=function(q,page,f){return limit((async()=>{q=String(q||'').trim();const m=/^(?:https?:\/\/)?((?:www\.)?tvroom\d+\.org)(\/[^#]*)?(?:#.*)?$/i.exec(q);if(m){if(!await this._commonAdopt('https://'+m[1].toLowerCase(),true))throw Error('진짜 티비룸 화면을 확인하지 못했습니다. 웹뷰로 확인해 주세요.');const path=m[2]||'/';if(path==='/')return this.getPopular(page);if(CATEGORIES.some(x=>path==='/video/'+x[0]))return this.listing(path,page);if(page>1)return {list:[],hasNextPage:false};const d=await this.getDetail(this.path(path).series);return {list:[{name:d.name,link:d.link,imageUrl:d.imageUrl}],hasNextPage:false}}if(!q)return old.search.call(this,q,page,f);const norm=x=>String(x).replace(/\s*\((?:19|20)\d{2}\)\s*$/,'').replace(/[^\p{L}\p{N}]/gu,'').toLowerCase(),n=norm(q),a=page>1&&read('last_query')===q?[read('used_query',q)]:queries(q);let out={list:[],hasNextPage:false};for(const s of a){out=await this.listing('/search/'+encodeURIComponent(s),page);if(s!==q)out.list=out.list.filter(e=>{const t=norm(e.name);return t.includes(n)||(t.length>=2&&n.includes(t))});if(out.list.length){put('last_query',q);put('used_query',s);return out}}return out})(),29000)};
