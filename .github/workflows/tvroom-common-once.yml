          function limit(p,ms){let t;return Promise.race([p,new Promise((_,bad)=>{t=setTimeout(()=>bad(Error('요청 시간이 길어 중단했습니다. 잠시 뒤 다시 시도해 주세요.')),ms)})]).finally(()=>clearTimeout(t))}
