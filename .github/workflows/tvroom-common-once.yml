name: 티비룸 공통 기능 보완과 재생 보존 검사
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tvroom-common-once.yml'
permissions:
  contents: write
concurrency:
  group: tvroom-common-once
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 공통 기능 적용과 재생 보존 검사
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),vm=require('node:vm'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const FILE='anime/tvroom.js';
          const ADDON=String.raw`
