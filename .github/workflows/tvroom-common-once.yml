          const S=mangayomiSources[0],ROOT='https://raw.githubusercontent.com/insid0909-max/my-ext/main/',old={popular:P.getPopular,latest:P.getLatestUpdates,search:P.search,detail:P.getDetail,prefs:P.getSourcePreferences,listing:P.listing,cards:P.cards};
