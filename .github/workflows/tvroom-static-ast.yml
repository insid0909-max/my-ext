name: Tvroom saved source AST analysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-static-ast.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Prepare AST reanalysis of saved tvroom sources'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import os,json,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];url='https://api.github.com/repos/'+repo+'/actions/artifacts?name=tvroom-static-source-investigation&per_page=20'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
          candidates=[a for a in data['artifacts'] if a['name']=='tvroom-static-source-investigation' and not a['expired'] and a.get('workflow_run',{}).get('head_sha')=='e630f162b12a0ed1dea7a332ee227895da780043']
          if not candidates: raise RuntimeError('Matching saved source artifact unavailable; no remote source refetch performed')
          a=max(candidates,key=lambda x:x['created_at'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('run_id='+str(a['workflow_run']['id'])+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: tvroom-static-source-investigation
          path: saved-static-source
          run-id: ${{ steps.saved.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install parser without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/tvroom-parser" --ignore-scripts --no-audit --no-fund acorn@8
      - name: Parse saved text without executing source
        env:
          NODE_PATH: ${{ runner.temp }}/tvroom-parser/node_modules
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict'),acorn=require('acorn');
          const wanted=new Set(['MediaInfo','LoadRequest','loadMedia','loadSource','initChromecast','customType','keyLoader']);
          function inspect(source){
          const masks=[],hits=[];const ast=acorn.parse(source,{ecmaVersion:'latest',sourceType:'script',allowHashBang:true,onComment:(block,text,start,end)=>masks.push([start,end,'/*comment*/'])});
          const name=n=>n?.type==='Identifier'?n.name:n?.type==='Literal'&&typeof n.value==='string'?n.value:null;
          function walk(node){if(!node||typeof node.type!=='string')return;
          if(node.type==='Literal')masks.push([node.start,node.end,'"[literal]"']);if(node.type==='TemplateLiteral')masks.push([node.start,node.end,'"[template]"']);
          if(node.type==='CallExpression'||node.type==='NewExpression'){const callee=node.callee,term=callee?.type==='MemberExpression'?name(callee.property):name(callee);if(wanted.has(term))hits.push({term,start:node.start,end:node.end,kind:node.type})}
          if(node.type==='Property'&&wanted.has(name(node.key)))hits.push({term:name(node.key),start:node.start,end:node.end,kind:'Property'});
          for(const value of Object.values(node)){if(Array.isArray(value)){for(const child of value)if(child&&typeof child.type==='string')walk(child)}else if(value&&typeof value.type==='string')walk(value)}
          }walk(ast);masks.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
          function excerpt(start,end){let position=start,out='';for(const [a,b,label] of masks){if(b<=position)continue;if(a>=end)break;out+=source.slice(position,Math.max(position,a));out+=label;position=Math.max(position,Math.min(end,b))}out+=source.slice(position,end);return out.replace(/https?:\/\/[^\s"<>]+/g,'[url]').replace(/[A-Za-z0-9_+-]{48,}/g,'[long-token]')}
          const counts={},excerpts=[];for(const term of wanted){const matches=hits.filter(x=>x.term===term);counts[term]=matches.length;for(const hit of matches.slice(0,2))excerpts.push({...hit,masked_code:excerpt(Math.max(0,hit.start-700),Math.min(source.length,hit.end+1300))})}return {counts,excerpts};
          }
          const sanity=inspect('const marker="https://example.com/SECRET"; /* MediaInfo(fake) */ function cast(){const o=player.options.video.url; const r=new Aa.media.MediaInfo(o);session.loadMedia(r);}');assert.equal(sanity.counts.MediaInfo,1);assert.equal(sanity.counts.loadMedia,1);assert(!JSON.stringify(sanity).includes('SECRET'));
          const baseline=JSON.parse(fs.readFileSync('diagnostics/tvroom-static-report.json','utf8')),report={checked_at:new Date().toISOString(),parser:'acorn '+acorn.version,scope:'Saved source hashes verified; AST only; source never executed. Literals, templates and comments masked. No user cookies, keys, tokens or media requests. Counts describe syntax, not runtime reachability.',files:[]};
          for(const name of ['DPlayer.min.js','stop.js']){const bytes=fs.readFileSync('saved-static-source/'+name),digest=crypto.createHash('sha256').update(bytes).digest('hex'),expected=baseline.files.find(x=>x.file===name)?.sha256;assert.equal(digest,expected);const row={file:name,bytes:bytes.length,sha256:digest};try{Object.assign(row,inspect(bytes.toString('utf8')));row.result='parsed_not_executed'}catch(e){row.result='parse_failed';row.error_type=e.name}report.files.push(row)}
          fs.writeFileSync('diagnostics/tvroom-static-ast-report.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Commit masked AST report only
        run: |
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add diagnostics/tvroom-static-ast-report.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Report AST analysis of saved tvroom sources [skip ci]'
            git push origin HEAD:main
          fi
