name: Remove TVRoom WebView tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-tvroom-webview-tests.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Prepare removal of TVRoom WebView handoff tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only isolated WebView test files
        run: |
          python3 <<'PY'
          import json, subprocess
          from pathlib import Path
          paths=['anime/tvroom_webview_test.js','test-index.json','tools/tvroom-webview-handoff.js','.github/workflows/tvroom-webview-handoff.yml','.github/workflows/tvroom-webview-handoff02.yml','.github/workflows/remove-tvroom-webview-tests.yml']
          before={p:Path(p).read_bytes() for p in ['index.json','anime/tvroom.js']}
          rows=json.loads(Path('test-index.json').read_text())
          assert len(rows)==1 and rows[0]['id']==1230463293 and rows[0]['version']=='0.0.2'
          assert 'id:1230463293,name:' in Path('anime/tvroom_webview_test.js').read_text()
          assert all(Path(p).is_file() for p in paths)
          subprocess.run(['git','rm','--',*paths],check=True)
          for p,data in before.items():
              assert Path(p).read_bytes()==data
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(paths)
          PY
          git diff --cached --check
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git commit -m 'Remove canceled TVRoom WebView handoff tests [skip ci]'
          git push origin HEAD:main
