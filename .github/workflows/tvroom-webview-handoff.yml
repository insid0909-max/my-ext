name: TVRoom WebView handoff test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-webview-handoff.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare TVRoom WebView handoff test 0.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated test extension
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const original=fs.readFileSync('anime/tvroom.js','utf8'),indexRaw=fs.readFileSync('index.json','utf8'),index=JSON.parse(indexRaw),adapter=fs.readFileSync('tools/tvroom-webview-handoff.js','utf8');
          const hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');
          assert.equal(hash(original),'ee928f37a359b1882054b049bf0ac8410daaed0c');
          assert(!index.some(x=>x.id===1230463293));assert(!fs.existsSync('anime/tvroom_webview_test.js'));assert(!fs.existsSync('test-index.json'));
          const cut=original.indexOf('async getVideoList(t){');assert(cut>0);
          let base=original.slice(0,cut)+'}\n';
          assert(base.includes('id:1230463291,name:"티비룸(글리치전용)"'));assert(base.includes('version:"1.0.13"'));
          base=base.replace('id:1230463291,name:"티비룸(글리치전용)"','id:1230463293,name:"티비룸 웹뷰 인계시험"').replace('version:"1.0.13"','version:"0.0.1"');
          const output=base+adapter;new vm.Script(output);assert(!output.includes('X-Hls-Key'));
          class Test{};const data={url:'https://player.pongping.top/stream/m3u8/mock',page:'https://player-v2.pongping.top/player/v3/mock',ua:'WebView-Test-UA',readyState:2};let passedHeaders;
          const ctx={DefaultExtension:Test,evaluateJavascriptViaWebview:async(u,h,s,t)=>{assert.equal(t,18);assert.equal(s.length,1);new vm.Script(s[0]);return JSON.stringify(data)},createHlsProxyUrl:async(u,h)=>{passedHeaders=h;return 'http://127.0.0.1:1234/test/playlist.m3u8'}};vm.runInNewContext(adapter,ctx);
          async function test(){const ext=new Test();ext.baseUrl='https://tvroom46.org';ext.path=()=>({series:'/video/test',episode:'1'});ext.document=async()=>({selectFirst:()=>({attr:()=>data.page})});const result=await ext.getVideoList('/video/test/1');assert.equal(result.length,2);assert.equal(result[0].headers['User-Agent'],'WebView-Test-UA');assert.equal(passedHeaders.Referer,'https://player-v2.pongping.top/');assert(!('Cookie' in passedHeaders));assert(!('X-Hls-Key' in passedHeaders));assert.equal(Object.keys(result[1].headers).length,0);
          const row={...index.find(x=>x.id===1230463291),id:1230463293,name:'티비룸 웹뷰 인계시험',version:'0.0.1',sourceCodeUrl:'https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_webview_test.js?v=0.0.1',notes:'순정 0.9.95 웹뷰 주소 인계 시험. 실제 재생 미검증. 웹뷰 결과 반환 후 종료됨. HttpOnly 쿠키 전달·키 변환·영상 조각 변환 없음. A 직접 인계 / B 순정 프록시. 기존 글리치 전용 확장과 별개.'};fs.writeFileSync('anime/tvroom_webview_test.js',output);fs.writeFileSync('test-index.json',JSON.stringify([row],null,2)+'\n');assert.equal(fs.readFileSync('anime/tvroom.js','utf8'),original);assert.equal(fs.readFileSync('index.json','utf8'),indexRaw)}test().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node --check anime/tvroom_webview_test.js
          git diff --check
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_webview_test.js test-index.json
          git commit -m 'Add TVRoom WebView handoff test 0.0.1 [skip ci]'
          git push origin HEAD:main
