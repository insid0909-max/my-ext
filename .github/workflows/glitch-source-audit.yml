name: Glitch source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glitch-source-audit.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'Glitch 배포 소스 직접 점검 준비'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          import urllib.request,urllib.parse,html.parser,io,zipfile,tarfile,json,re,hashlib,pathlib,datetime
          base='https://mangayomi-99c143.espr.page/'
          report={'time':datetime.datetime.now(datetime.timezone.utc).isoformat(),'page':base,'executed_source':False}
          root=pathlib.Path('tools/glitch-source-audit');root.mkdir(parents=True,exist_ok=True)
          def get(url,cap):
              if urllib.parse.urlsplit(url).scheme!='https':raise ValueError('HTTPS required')
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:
                  if urllib.parse.urlsplit(r.url).scheme!='https':raise ValueError('HTTPS redirect required')
                  data=r.read(cap+1)
                  if len(data)>cap:raise ValueError('download size limit')
                  return data,r.url
          class Links(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.a=None
              def handle_starttag(self,tag,attrs):
                  if tag=='a':self.a=[dict(attrs).get('href',''),'']
              def handle_data(self,data):
                  if self.a is not None:self.a[1]+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.a is not None:self.links.append(self.a);self.a=None
          try:
              raw,final=get(base,2000000);p=Links();p.feed(raw.decode('utf-8','replace'));links=[{'url':urllib.parse.urljoin(final,u),'label':t.strip()} for u,t in p.links if u];report['links']=links
              candidates=[x for x in links if re.search(r'source|소스',x['label']+' '+x['url'],re.I) and re.search(r'\.(?:zip|tar\.gz|tgz)(?:[?#]|$)|/zipball/|/tarball/',x['url'],re.I)]
              if len(candidates)!=1:report['stage']='source archive link missing or ambiguous';report['candidates']=candidates
              else:
                  data,url=get(candidates[0]['url'],250000000);report.update(source_url=url,archive_bytes=len(data),sha256=hashlib.sha256(data).hexdigest());items=[]
                  if zipfile.is_zipfile(io.BytesIO(data)):
                      z=zipfile.ZipFile(io.BytesIO(data));items=[(i.filename,i.file_size,lambda i=i:z.read(i)) for i in z.infolist() if not i.is_dir()]
                  else:
                      z=tarfile.open(fileobj=io.BytesIO(data),mode='r:*');items=[(i.name,i.size,lambda i=i:z.extractfile(i).read()) for i in z.getmembers() if i.isfile()]
                  report['archive_files']=len(items);report['matches']=[];pattern=re.compile(r'createHlsProxyUrl|evaluateJavascriptViaWebview|X-Hls-Key|useDartHttpClient|class MClient')
                  for name,size,read in items:
                      if size>1500000 or not name.endswith(('.dart','.js','.md')):continue
                      text=read().decode('utf-8','replace');lines=text.splitlines();hits=[i for i,line in enumerate(lines) if pattern.search(line)]
                      if not hits:continue
                      spans=sorted({j for i in hits[:12] for j in range(max(0,i-10),min(len(lines),i+25))});excerpt='\n'.join(str(j+1)+': '+lines[j] for j in spans)[:35000];dest='match-'+str(len(report['matches'])+1)+'.txt';(root/dest).write_text(excerpt,encoding='utf-8');report['matches'].append({'archive_path':name,'lines':[i+1 for i in hits],'excerpt':dest})
                      if len(report['matches'])>=35:break
                  report['stage']='archive downloaded and statically inspected'
          except Exception as e:report['stage']='failed';report['error']=str(e)[:500]
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add tools/glitch-source-audit
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'Glitch 배포 소스 직접 점검 결과 [skip ci]'
          git push origin HEAD:main
