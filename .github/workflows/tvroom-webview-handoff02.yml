name: TVRoom WebView handoff diagnostic 02
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-webview-handoff02.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare TVRoom WebView handoff test 0.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const ap='tools/tvroom-webview-handoff.js',ep='anime/tvroom_webview_test.js',old=fs.readFileSync(ap,'utf8'),extension=fs.readFileSync(ep,'utf8'),rows=JSON.parse(fs.readFileSync('test-index.json','utf8')),formal=fs.readFileSync('index.json','utf8'),original=fs.readFileSync('anime/tvroom.js','utf8');
          const hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(old),'205d32707043574fdae8574805f3d97588fbfe30');assert(extension.endsWith(old));
          function capture(){
            const start=Date.now();let done=false,target=null,identity='',last=null,total=0,samples=0,playingSeen=false,playError='';
            const allowed=u=>/^https:\/\/(?:[a-z0-9-]+\.)?pongping\.top\//i.test(u)&&/\.m3u8(?:[?#]|$)|\/stream\/m3u8\/|\.mp4(?:[?#]|$)/i.test(u);
            function finish(data){if(done)return;done=true;window.flutter_inappwebview.callHandler('setResponse',JSON.stringify(data));}
            function fail(code,message){finish({error:code,message:message});}
            function tick(){
              if(done)return;const videos=Array.from(document.querySelectorAll('video'));
              if(videos.length>1){fail('MULTIPLE_VIDEO','영상 요소가 여러 개여서 본편을 자동 확정하지 않았습니다.');return;}
              if(target&&videos[0]!==target){fail('VIDEO_CHANGED','검사 중 영상 요소가 바뀌었습니다.');return;}
              if(!target&&videos.length===1){target=videos[0];target.addEventListener('playing',()=>{playingSeen=true;});target.muted=true;try{const p=target.play();if(p&&p.catch)p.catch(e=>{playError=String(e.name||'PLAY_REJECTED');});}catch(e){playError=String(e.name||'PLAY_REJECTED');}}
              if(target){
                if(target.error){fail('MEDIA_ERROR','웹뷰 영상 오류 코드 '+Number(target.error.code));return;}
                const src=String(target.currentSrc||target.src||'');
                if(src!==identity){identity=src;last=null;total=0;samples=0;}
                const time=Number(target.currentTime)||0;
                if(!target.paused&&!target.seeking&&!target.ended&&last!==null){const delta=time-last;if(delta>0&&delta<1.5){total+=Math.min(delta,0.6);samples++;}else{total=0;samples=0;}}else{total=0;samples=0;}last=time;
                if(samples>=3&&total>=1){
                  if(!allowed(src)){fail('SOURCE_UNBOUND',src.startsWith('blob:')?'웹뷰 시간 진행은 확인했지만 blob 영상과 원본 HLS 주소의 대응은 확인하지 못했습니다.':'웹뷰 시간 진행은 확인했지만 지원하는 직접 영상 주소가 아닙니다.');return;}
                  finish({url:src,page:location.href,ua:navigator.userAgent,playbackVerified:true,playingSeen:playingSeen,readyState:Number(target.readyState)||0,advancedSeconds:Number(total.toFixed(2))});return;
                }
              }
              if(Date.now()-start>=16000){fail('PLAYBACK_NOT_CONFIRMED','웹뷰 재생 진행을 확인하지 못했습니다. 영상요소 '+videos.length+'개'+(playError?' / 재생 요청 거부: '+playError:''));return;}
              setTimeout(tick,300);
            }tick();
          }
          const begin=old.indexOf('  const capture = function(){'),end=old.indexOf('  const origin=',begin);assert(begin>=0&&end>begin);let next=old.slice(0,begin)+'  const capture = '+capture.toString()+';\n'+old.slice(end);
          const oldError="    if(result.error)throw Error(result.error==='BLOB_ONLY'?'웹뷰 내부 blob 영상만 확인됐습니다. 일반 영상 주소를 인계하지 못했습니다.':'웹뷰에서 지원하는 영상 주소를 확인하지 못했습니다.');";assert(next.includes(oldError));next=next.replace(oldError,"    if(result.error)throw Error('[웹뷰 인계 0.0.2] '+String(result.message||result.error));\n    if(result.playbackVerified!==true)throw Error('웹뷰 재생 진행이 검증되지 않았습니다.');");
          assert(next.includes('],18)'));next=next.replace('],18)','],24)');const oldTag="tag=Number(result.readyState)>=2?'웹뷰 데이터 로드 확인':'주소만 확인'";assert(next.includes(oldTag));next=next.replace(oldTag,"tag='동일 영상 시간 진행 확인'");
          const prefix=extension.slice(0,-old.length);assert(prefix.includes('version:"0.0.1"'));const out=prefix.replace('version:"0.0.1"','version:"0.0.2"')+next;new vm.Script(out);
          function simulate(moving,src,count=1){let now=0,result=null,queue=[];const listeners={};const video={currentSrc:src,src:src,currentTime:0,paused:false,seeking:false,ended:false,readyState:2,error:null,addEventListener:(name,fn)=>listeners[name]=fn,play:()=>{listeners.playing?.();}};const ctx={Date:{now:()=>now},document:{querySelectorAll:()=>count===1?[video]:[video,{}]},location:{href:'https://player-v2.pongping.top/player/v3/mock'},navigator:{userAgent:'mock'},window:{flutter_inappwebview:{callHandler:(name,value)=>result=JSON.parse(value)}},setTimeout:(fn,ms)=>queue.push([fn,ms])};vm.runInNewContext('('+capture.toString()+')()',ctx);for(let i=0;!result&&queue.length&&i<100;i++){const[fn,ms]=queue.shift();now+=ms;if(moving)video.currentTime+=ms/1000;fn();}assert(result);return result;}
          assert.equal(simulate(true,'https://player.pongping.top/stream/m3u8/mock').playbackVerified,true);assert.equal(simulate(false,'https://player.pongping.top/stream/m3u8/mock').error,'PLAYBACK_NOT_CONFIRMED');assert.equal(simulate(true,'blob:mock').error,'SOURCE_UNBOUND');assert.equal(simulate(true,'https://player.pongping.top/stream/m3u8/mock',2).error,'MULTIPLE_VIDEO');
          const row=rows.find(x=>x.id===1230463293);assert(row&&row.version==='0.0.1');row.version='0.0.2';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_webview_test.js?v=0.0.2';row.notes='진단 보정판. 하나의 영상 요소에서 탐색 없이 시간 진행을 확인하고 그 영상의 직접 주소만 인계. 다중 영상·blob 주소 대응 불가·재생 실패 구분. 쿠키·키·조각 변환 없음. 실제 휴대폰 재생 미검증.';
          fs.writeFileSync(ap,next);fs.writeFileSync(ep,out);fs.writeFileSync('test-index.json',JSON.stringify(rows,null,2)+'\n');assert.equal(fs.readFileSync('index.json','utf8'),formal);assert.equal(fs.readFileSync('anime/tvroom.js','utf8'),original);
          NODE
          node --check anime/tvroom_webview_test.js
          git diff --check
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add tools/tvroom-webview-handoff.js anime/tvroom_webview_test.js test-index.json
          git commit -m 'TVRoom WebView handoff 0.0.2 verified progress diagnostics [skip ci]'
          git push origin HEAD:main
