name: 티비룸 방영 상태와 회차 표시 수정
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-episode-status-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 방영 상태·회차 표시와 예외 보존 검사
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const vm=require('node:vm'),assert=require('node:assert/strict');
          async function verify(before,after){const fn=(s,name)=>{const m=new RegExp('^function '+name+'\\([^\\n]*$','m').exec(s);assert(m,name+' 없음');return m[0]},now=Date.UTC(2026,10,8,14,36),c={Date:class extends Date{static now(){return now}}};vm.createContext(c);vm.runInContext(['date','number','normalise','airStatus','formatEpisode'].map(n=>fn(after,n)).join('\n')+';globalThis.h={date,normalise,airStatus,formatEpisode};',c);const h=c.h,t=Number(h.date('261108')),old=Number(h.date('261017')),edge=Number(h.date('261018'));assert.equal(h.airStatus(false,t,'',now),0);assert.equal(h.airStatus(false,edge,'',now),0);assert.equal(h.airStatus(false,old,'',now),1);assert.equal(h.airStatus(true,t,'',now),1);assert.equal(h.airStatus(false,0,'',now),5);assert.equal(h.airStatus(false,0,'방영 중',now),0);assert.equal(h.airStatus(false,Number(h.date('261109')),'',now),5);assert.equal(h.airStatus(false,t,'종영',now),0);assert.equal(h.airStatus(false,old,'방영 중',now),1);const e={name:'제10회 261108',url:'/video/test/e10',dateUpload:String(t)};assert.equal(h.formatEpisode(e,false).name,'10회 (11.08)');assert.equal(h.formatEpisode(e,false).url,e.url);assert.equal(h.formatEpisode({...e,name:'10회 (11.08)'},false).name,'10회 (11.08)');assert.equal(h.formatEpisode({...e,name:'제10화 261108'},false).name,'10화 (11.08)');assert.equal(h.formatEpisode({...e,name:'제10회',dateUpload:null},false).name,'10회');assert.equal(h.formatEpisode({...e,name:'1. 본편'},true).name,'1. 본편');assert.equal(h.formatEpisode({...e,name:'1. 특집 261108'},false).name,'1. 특집 261108');const d=h.normalise([{...e,name:'제1회 261108',url:'a'},{...e,name:'제1회 261108',url:'b'}],'작품',false).map(e=>h.formatEpisode(e,false));assert.equal(new Set(d.map(e=>/^\d+(?:\.\d+)?/.exec(e.name)[0])).size,2);assert.equal(h.formatEpisode({...e,name:'1. 261108'},false).name,'1회 (11.08)');for(const [s,status,name]of [[before,5,'제10회 261108'],[after,0,'10회 (11.08)']]){const detail=/^P\.getDetail=async function\(u\)\{const d=await old\.detail[^\n]*$/m.exec(s)?.[0];assert(detail);const x={Date:c.Date,P:{},old:{detail:async()=>({name:'작품',link:'/video/test',genre:[],description:'',chapters:[e]})},first:(n,sel)=>null,attr:()=>'',text:()=>''};vm.createContext(x);vm.runInContext(['date','number','normalise','airStatus','formatEpisode'].map(n=>fn(after,n)).join('\n')+'\n'+detail,x);const result=await x.P.getDetail.call({path:()=>({series:'/video/test'})},'/video/test');assert.equal(result.status,status);assert.equal(result.episodes[0].name,name);assert.equal(result.episodes[0].url,e.url);assert.strictEqual(result.episodes,result.chapters);assert(result.description.includes('최근 방영: 2026.11.08'))}console.log('21일 경계·영화·날짜 없음·미래 날짜·회차 표시·특집·중복 번호·상세 회귀 검사 통과')}

          (async()=>{const file='anime/tvroom.js',before=fs.readFileSync(file,'utf8'),b=Buffer.from(before),sha=crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');assert.equal(sha,'4779b0881f4b2b5c699a0c88345751d2fb3e1388','원본이 바뀌어 재검토가 필요합니다.');const marker="P.getDetail=async function(u){const d=await old.detail.call(this,u),doc=this._docs?.get(this.path(u).series)",extra="function airStatus(movie,latest,siteStatus,now=Date.now()){if(movie)return 1;latest=Number(latest);if(Number.isFinite(latest)&&latest>0){const age=Math.floor((now+32400000)/86400000)-Math.floor((latest+32400000)/86400000);if(age>=0)return age<=21?0:1}return /완결|종영/.test(siteStatus)?1:/방영\\s*중|연재\\s*중/.test(siteStatus)?0:5}\nfunction formatEpisode(e,movie){if(movie)return e;const name=String(e.name||'');if(/특집|특별편|예고|외전|전편|후편|미방영|무삭제|확장판|\\d+\\s*부|\\b(?:OVA|SP\\d*|SPECIAL|PREVIEW)\\b/i.test(name))return e;const lead=/^\\s*(\\d+(?:\\.\\d+)?)\\.\\s+/.exec(name),plain=lead?name.slice(lead[0].length):name,normal=/(?:제\\s*)?\\d+(?:\\.\\d+)?\\s*(회|화)/.exec(plain),datedOnly=/^\\s*(?:\\d{6}|\\d{8}|\\d{2,4}[-./]\\d{1,2}[-./]\\d{1,2})\\s*$/.test(plain)&&date(plain);if((!normal&&!datedOnly)||(datedOnly&&!lead))return e;const n=lead?Number(lead[1]):number(plain);if(!Number.isFinite(n)||n<0)return e;const time=Number(e.dateUpload)||Number(date(plain))||0,day=Number.isFinite(time)&&time>0?new Date(time+32400000):null,pad=x=>String(x).padStart(2,'0'),short=day?pad(day.getUTCMonth()+1)+'.'+pad(day.getUTCDate()):/\\((\\d{2}\\.\\d{2})\\)/.exec(plain)?.[1]||'';return {...e,name:n+(normal?.[1]||'회')+(short?' ('+short+')':'')}}\n",oldStatus="d.status=movie?1:/완결|종영/.test(status)?1:/방영\\s*중|연재\\s*중/.test(status)?0:5;const latest=Math.max(0,...d.episodes.map(e=>Number(e.dateUpload)||0)),day=",newStatus="const latest=Math.max(0,...d.episodes.map(e=>Number(e.dateUpload)||0));d.status=airStatus(movie,latest,status);const day=",oldEpisodes="d.episodes=normalise(list,raw,movie);d.chapters=d.episodes;",newEpisodes="d.episodes=normalise(list,raw,movie).map(e=>formatEpisode(e,movie));d.chapters=d.episodes;";for(const x of [marker,oldStatus,oldEpisodes])assert.equal(before.split(x).length,2,'수정 위치 불일치');const after=before.replace(marker,extra+marker).replace(oldStatus,newStatus).replace(oldEpisodes,newEpisodes).replace(/version:\s*["']1\.0\.10["']/,'version:"1.0.11"'),mask=s=>s.replace(extra,'').replace(newStatus,oldStatus).replace(newEpisodes,oldEpisodes).replace(/version:\s*["']1\.0\.(?:10|11)["']/,'VERSION');assert.equal(mask(before),mask(after),'요청한 상태·회차 표시와 버전 외 변경 금지');await verify(before,after);const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463291);assert(row&&row.version==='1.0.10');row.version='1.0.11';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom.js?v=1.0.11';const notes=JSON.parse(fs.readFileSync('changelog.json','utf8'));notes.items.tvroom.unshift({d:'2026-11-08',t:'1.0.11: 최근 회차의 한국 날짜 기준 21일 이내는 방영 중·이후는 완결로 판정. 영화·날짜 없는 상태는 기존 기준 유지. 일반 회차를 10회 (11.08) 형식으로 통일하고 특집·고유 번호·주소는 보존. 회차 이름 변경으로 기존 다운로드 표시가 달라질 수 있음. Glitch 재생·키·프록시 유지.'});const rows=[];for(const[k,list]of Object.entries(notes.items))for(const n of list)rows.push({name:notes.names?.[k]||k,...n});rows.sort((a,b)=>String(b.d).localeCompare(String(a.d)));const md=['# 업데이트 내역','','확장별 수정 이력입니다.',''];let day='';for(const n of rows){if(day!==n.d){day=n.d;md.push('## '+day,'')}md.push('- '+n.name+': '+n.t)}fs.writeFileSync(file,after);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync('업데이트내역.md',md.join('\n')+'\n');fs.appendFileSync('tools/tvroom-common-checklist.md','\n## 1.0.11 방영 상태와 회차 표시\n\n영화는 완결을 유지합니다. 그 외에는 최근 회차의 한국 날짜 기준 21일 이내를 방영 중, 22일부터 완결로 추정합니다. 날짜가 없거나 미래 날짜뿐이면 기존 명시 상태를 유지합니다. 일반 회차는 10회 (11.08) 형식으로 표시하며 날짜가 없으면 번호와 단위를 표시합니다. 특집·예고·부 구분, 중복 보정 번호, scanlator, 회차 URL과 날짜는 보존합니다. 이름 변경은 기존 다운로드 표시를 바꿀 수 있습니다. 재생·키·프록시는 변경하지 않습니다. 경계/예외/상세 모의 검사와 구문 검사이며 실기기 확인은 별도입니다.\n');console.log('티비룸 1.0.11 방영 상태·회차 이름 표시 갱신')})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: 검사된 티비룸 수정만 반영
        run: |
          node --check anime/tvroom.js
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- anime/tvroom.js index.json changelog.json 업데이트내역.md tools/tvroom-common-checklist.md
          git diff --cached --check
          git commit -m "티비룸 1.0.11 최근 방영일 기준 상태·회차 이름 통일"
          git push origin HEAD:main
