name: Tvroom stock test 05
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test05.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare tvroom stock 0.0.5 direct diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),original=fs.readFileSync(main,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'a27cd0c4eae52496f489faa94a034a8e58465c57');
          const start=before.lastIndexOf(';(function(P){');assert(start>0);let tail=before.slice(start);
          function swap(a,b){assert.equal(tail.split(a).length,2,a);tail=tail.replace(a,b)}
          swap("if(!local){save('0.0.4: 반환 목록에서 로컬 프록시 주소를 찾지 못함');return result}","if(!local){save('0.0.4: 반환 목록에서 로컬 프록시 주소를 찾지 못함');throw Error(read()+' | 진단 전용: 재생하지 않습니다.')}");
          const re=/return result;\s*};\s*P\.getFilterList=function/;assert(re.test(tail));tail=tail.replace(re,"throw Error(read()+' | 진단 전용: 결과 표시를 위해 재생을 의도적으로 중단했습니다.');\n};\nP.getFilterList=function");
          const out=(before.slice(0,start)+tail).replaceAll('0.0.4','0.0.5');new vm.Script(out);
          async function test(){
          for(const mode of ['ok','failed','missing']){
          class Extension{};Extension.prototype.getVideoList=async()=>mode==='missing'?[]:[{url:'http://127.0.0.1:1234/test',headers:{}}];Extension.prototype.getFilterList=()=>[];Extension.prototype.getDetail=async()=>({description:''});
          const context={DefaultExtension:Extension,SharedPreferences:class{get(){return ''}setString(){}},Client:class{async get(){if(mode==='failed')throw Error('timeout');return {statusCode:200,body:'#EXTM3U\n#EXTINF:4,\npart.ts'}}}};vm.runInNewContext(out.slice(out.lastIndexOf(';(function(P){')),context);
          await assert.rejects(()=>new Extension().getVideoList('/test'),e=>String(e.message).includes(mode==='ok'?'EXTM3U 확인':mode==='failed'?'시간 초과':'찾지 못함')&&String(e.message).includes('진단 전용'));
          }
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.4');row.version='0.0.5';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.5';row.notes='진단 전용: 회차 실행 시 로컬 프록시 사전검사 결과를 오류창에 직접 표시하고 재생을 의도적으로 중단합니다. 플레이어·영상조각·키 수신 미검사. 기존 티비룸과 키 처리 유지.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(fs.readFileSync(main,'utf8'),original);
          }test().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m 'Tvroom stock 0.0.5 direct diagnostic stop [skip ci]'
          git push origin HEAD:main
