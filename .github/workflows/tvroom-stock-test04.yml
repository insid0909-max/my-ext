name: Tvroom stock test 04
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test04.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare tvroom stock 0.0.4 local playlist probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex'),before=fs.readFileSync(p,'utf8'),original=fs.readFileSync(main,'utf8');
          assert.equal(hash(before),'9b7c09922774d320df5519634e1d7814f7ec8ac7');
          const patch=String.raw`
          ;(function(P){
          const video=P.getVideoList,filters=P.getFilterList,detail=P.getDetail;
          let memory='';
          function save(s){memory=s;try{new SharedPreferences().setString('tvroom_probe04',s)}catch(_){}}
          function read(){if(memory)return memory;try{return String(new SharedPreferences().get('tvroom_probe04')||'')}catch(_){return ''}}
          P.getVideoList=async function(u){
          save('0.0.4 별도 사전검사: 영상 주소 추출 중');
          let result;try{result=await video.call(this,u)}catch(e){save('0.0.4: 추출 단계 실패 · 기존 오류창 확인');throw e}
          const local=Array.isArray(result)?result.find(x=>/^http:\/\/127\.0\.0\.1:\d+\//.test(String(x.url||''))):null;
          if(!local){save('0.0.4: 반환 목록에서 로컬 프록시 주소를 찾지 못함');return result}
          save('0.0.4 별도 사전검사: 로컬 프록시 응답 대기');
          try{
          const c=new Client({useDartHttpClient:true,noProxy:true,followRedirects:false,timeout:6,connectTimeout:3});
          const r=await c.get(local.url,local.headers||{}),body=String(r.body||'').replace(/^\uFEFF/,'').trim(),ok=body.startsWith('#EXTM3U'),lines=body.split(/\r?\n/),kind=/#EXT-X-STREAM-INF:/.test(body)?'상위목록':/#EXTINF:/.test(body)?'미디어목록':'종류 미확인',count=lines.filter(x=>x.trim()&&!x.trim().startsWith('#')).length;
          save('0.0.4 별도 사전검사: 로컬 HTTP '+Number(r.statusCode)+' · '+(ok?'EXTM3U 확인 · '+kind+' · URI행 '+count+' · KEY태그 '+(/#EXT-X-KEY:/.test(body)?'있음':'없음'):'EXTM3U 아님')+' · 플레이어 요청·영상조각·키 수신은 미검사');
          }catch(e){save('0.0.4 별도 사전검사: 로컬 요청 실패 · '+(/timeout|timed out|시간/i.test(String(e))?'시간 초과':/refused/i.test(String(e))?'연결 거부':'클라이언트 오류')+' · 원래 영상 주소는 반환함')}
          return result;
          };
          P.getFilterList=function(){return [{type_name:'HeaderFilter',name:read()||'0.0.4 로컬 사전검사: 회차 실행 필요'},...filters.call(this)]};
          P.getDetail=async function(u){const d=await detail.call(this,u);d.description=(d.description||'')+'\n[로컬 프록시 사전검사]\n'+(read()||'회차 실행 필요')+'\n별도 GET 검사이며 실제 플레이어 요청 추적이 아닙니다. 주소·쿠키·키·본문은 기록하지 않습니다.';return d};
          })(DefaultExtension.prototype);
          `;
          const out=before.replaceAll('0.0.3','0.0.4')+patch;new vm.Script(out);
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.3');row.version='0.0.4';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.4';row.notes='로컬 프록시 별도 GET 사전검사: HTTP 상태·EXTM3U 여부만 기록. 실제 플레이어·영상조각·키 수신 미검사. 원래 주소 반환과 키 처리 유지.';
          fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(fs.readFileSync(main,'utf8'),original);
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m 'Tvroom stock 0.0.4 local playlist probe [skip ci]'
          git push origin HEAD:main
