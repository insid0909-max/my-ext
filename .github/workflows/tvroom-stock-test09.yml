name: Tvroom stock test 09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test09.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare tvroom stock 0.0.9 cast call probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),original=fs.readFileSync(main,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'34cdcac44589566cbd3973ee3cc1fcc814293a6a');let out=before;
          function swap(a,b){assert.equal(out.split(a).length,2,a);out=out.replace(a,b)}
          const helper=String.raw`
          function calls(s){
          const items=[],re=/\b(MediaInfo|LoadRequest|loadMedia|loadSource)\s*\(\s*([^,;\r\n)]{0,160})/g;let m;
          while((m=re.exec(s))&&items.length<5){const raw=m[2].trim(),simple=/^[A-Za-z_$][A-Za-z0-9_$]{0,23}(?:\.[A-Za-z_$][A-Za-z0-9_$]{0,23}){0,3}$/.test(raw)&&!/[A-Fa-f0-9]{12}/.test(raw),label=simple?raw:/^["'\x60]/.test(raw)?'문자열숨김':'복합식숨김';const item=m[1]+'('+label+')';if(!items.includes(item))items.push(item)}
          return items.join(',')||'호출형태 미발견';
          }
          `;
          swap('P.getVideoList=async function(u){\nconst report=',helper+'P.getVideoList=async function(u){\nconst report=');
          swap("report.push('H C='+flags(body,cast)+' K='+flags(body,key));","report.push('H '+calls(body));");
          swap("' C='+flags(text,cast)+' K='+flags(text,key)","' '+calls(text)");
          swap("문자열 단서일 뿐 지원 확정 아님. 키·영상·API 미요청. JS 미실행. 진단용 재생 중단.","정규식 호출후보·실행흐름 미확인. 키·영상·API 미요청. 진단중단.");
          out=out.replaceAll('0.0.8','0.0.9');new vm.Script(out);const sandbox={};vm.runInNewContext(helper+';this.inspect=calls;',sandbox);assert.equal(sandbox.inspect('new chrome.cast.media.MediaInfo(videoUrl, mime);hls.loadSource(videoUrl);session.loadMedia(request);'),'MediaInfo(videoUrl),loadSource(videoUrl),loadMedia(request)');assert(!sandbox.inspect('MediaInfo("https://example.com/SECRET", mime)').includes('SECRET'));
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.8');row.version='0.0.9';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.9';row.notes='진단 전용: HTML과 동일 호스트 JS 최대 2개에서 MediaInfo·LoadRequest·loadMedia·loadSource 호출후보의 단순 변수/속성 첫인자만 표시. 문자열·복합식 비표시. 정규식 검사로 실제 실행·값 동일성·서버경로 확정 불가. 키·영상·캐스트 API 미요청·JS 미실행. 결과창 후 재생중단. 기존 티비룸 유지.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(fs.readFileSync(main,'utf8'),original);
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m 'Tvroom stock 0.0.9 cast call diagnostic [skip ci]'
          git push origin HEAD:main
