name: Tvroom stock test 03
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test03.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == '티비룸 순정 호환시험 0.0.3 재생 시험 준비'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'3b20d939014e60b75bc7083ba63e1462967359da');assert.equal(hash(fs.readFileSync(main,'utf8')),'b4c101b4f0ec16f0cf6f0cd8a6deb5d8a743cbf1');let out=before;function swap(a,b){assert.equal(out.split(a).length,2,a);out=out.replace(a,b);}
          swap("throw Object.assign(Error(last()+' | 진단을 위해 재생 전 의도적으로 중단했습니다.'),{stockDiagnostic02:true});",'return result;');
          swap('if(e&&e.stockDiagnostic02)throw e;','');
          swap('version:\"0.0.2\"','version:\"0.0.3\"');
          out=out.replaceAll('시험 0.0.2','시험 0.0.3').replaceAll('진단판 0.0.2','재생시험 0.0.3').replaceAll('아직 기록 없음 · 회차를 누르면 진단창에 결과를 직접 표시합니다.','아직 기록 없음 · 회차 실행 후 마지막 추출 결과를 표시합니다.');assert(!out.includes('stockDiagnostic02'));assert(!out.includes('의도적으로 중단했습니다'));fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292),original=index.find(x=>x.id===1230463291);assert(row&&original);assert.equal(row.version,'0.0.2');assert.equal(original.version,'1.0.11');row.version='0.0.3';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.3';row.notes='실제 재생 시험판: 진단용 강제 중단 해제. 영상 주소 반환은 재생 성공을 의미하지 않습니다. 기존 티비룸 변경 없음.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(hash(fs.readFileSync(main,'utf8')),'b4c101b4f0ec16f0cf6f0cd8a6deb5d8a743cbf1');
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m '티비룸 순정 호환시험 0.0.3 재생 중단 해제 [skip ci]'
          git push origin HEAD:main
