name: Tvroom stock test 07
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test07.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare tvroom stock 0.0.7 player structure probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),original=fs.readFileSync(main,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'944cb43add87b53a97cefefb4e2c560a1609fded');
          const patch=String.raw`
          ;(function(P){
          P.getVideoList=async function(u){
          const report=['0.0.7 플레이어 구조 진단'];
          try{
          const path=this.path(u,true),doc=await this.document(path.series+'/'+path.episode),frame=doc.selectFirst('iframe#view_iframe'),src=String(frame?.attr('src')||'').trim(),origin=/^https:\/\/([a-z0-9.-]+)(?::[0-9]+)?(?:\/|$)/i.exec(src);
          if(!origin)throw Error('stage');
          const response=await new Client({timeout:10,connectTimeout:4}).get(src,{'User-Agent':USER_AGENT,Referer:this.baseUrl+'/'});
          report.push('플레이어 HTTP '+Number(response.statusCode));
          if(Number(response.statusCode)===200){
          const body=String(response.body||''),yn=x=>x?'있음':'없음';
          report.push('TVP_CONFIG '+yn(/\bTVP_CONFIG\b/.test(body)));
          report.push('Cast SDK '+yn(/cast_sender|cast_framework|chrome\.cast|cast\.framework|__onGCastApiAvailable/i.test(body)));
          report.push('캐스트 관련 문자열 '+yn(/chromecast|cast-register|player_api\/cast|requestSession/i.test(body)));
          report.push('키 처리 단서 '+yn(/encrypted_key|segment_sizes|permutation|noise_length|X-Hls-Key/i.test(body)));
          const scripts=[...body.matchAll(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);report.push('외부 script 참조 '+scripts.length+'개');
          const names=new Set();for(const raw of scripts.slice(0,20)){const clean=raw.split(/[?#]/)[0],host=/^(?:https?:)?\/\/([a-z0-9.-]+)(?::[0-9]+)?(?:\/|$)/i.exec(clean)?.[1]||'동일호스트 또는 상대경로',name=clean.split('/').pop()||'',safe=/^(?:hls|video|player|cast|cast_sender|jquery|shaka|jwplayer)(?:[.-](?:min|bundle|[0-9.]+))*\.js$/i.test(name)?name:'파일명 비표시';names.add(host+' / '+safe)}
          report.push(...[...names].slice(0,6));
          }
          }catch(_){report.push('페이지 조회 또는 분석 실패 · 원문 오류 비표시')}
          report.push('HTML 정적검사만 수행 · 외부 스크립트 미실행·미조회 · 기능 존재 확정 아님');report.push('키·영상·캐스트 API 요청 안함 · 토큰·쿠키·본문·전체 경로 기록 안함');report.push('진단 전용: 결과 표시 후 재생을 의도적으로 중단합니다.');
          throw Error(report.join(' | '));
          };
          })(DefaultExtension.prototype);
          `;
          const out=before.replaceAll('0.0.6','0.0.7')+patch;new vm.Script(out);
          async function test(){class Extension{};Extension.prototype.path=()=>({series:'/video/test',episode:'1'});Extension.prototype.document=async()=>({selectFirst:()=>({attr:()=> 'https://example.com/player?token=SECRET'})});Object.defineProperty(Extension.prototype,'baseUrl',{get:()=> 'https://example.com'});const context={DefaultExtension:Extension,USER_AGENT:'test',Client:class{async get(){return {statusCode:200,body:'<script src="https://cdn.example.com/player.min.js?token=SECRET"></script> TVP_CONFIG encrypted_key cast_sender'}}}};vm.runInNewContext(patch,context);await assert.rejects(()=>new Extension().getVideoList('/test'),e=>e.message.includes('TVP_CONFIG 있음')&&e.message.includes('player.min.js')&&!e.message.includes('SECRET')&&e.message.includes('진단 전용'));
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.6');row.version='0.0.7';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.7';row.notes='진단 전용: iframe 플레이어 HTML의 캐스트·키 처리 문자열과 제한된 스크립트 참조만 직접 결과창 표시. 키·영상·캐스트 API 요청 안함. 외부 JS 미조회·미실행. 전체 경로·토큰·쿠키·본문 비표시. 재생 의도적 중단. 기존 티비룸 변경 없음.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(fs.readFileSync(main,'utf8'),original)}test().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m 'Tvroom stock 0.0.7 player structure diagnostic [skip ci]'
          git push origin HEAD:main
