name: 티비룸 타이머 호환성 오류 수정
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-timer-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 타이머 부재 조건 검사와 최소 수정
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const vm=require('node:vm'),assert=require('node:assert/strict');
          async function check(helper){let cases=0;for(const mode of ['no-clear','promise-timer','no-timers']){const c={};if(mode!=='no-timers')c.setTimeout=mode==='promise-timer'?(fn,ms)=>new Promise(resolve=>setTimeout(()=>{fn();resolve()},ms)):(fn,ms)=>{setTimeout(fn,ms)};vm.createContext(c);vm.runInContext(helper+';globalThis.run=limit;',c);assert.equal(vm.runInContext('typeof clearTimeout',c),'undefined');assert.equal(await c.run(Promise.resolve('성공'),10),'성공');cases++;const original=Error('원래 통신 오류');await assert.rejects(c.run(Promise.reject(original),10),e=>e===original);cases++;if(mode!=='no-timers'){await assert.rejects(c.run(new Promise(()=>{}),1),/요청 시간이 길어/);cases++;await assert.rejects(c.run(new Promise(resolve=>setTimeout(resolve,20)),1),/요청 시간이 길어/);cases++}vm.runInContext("globalThis.pause=async()=>{const pause=1;if(pause&&typeof setTimeout==='function')await new Promise(r=>setTimeout(r,pause));return '유지'};",c);assert.equal(await c.pause(),'유지');cases++}await new Promise(resolve=>setTimeout(resolve,30));return cases}

          (async()=>{const file='anime/tvroom.js',before=fs.readFileSync(file,'utf8'),b=Buffer.from(before),sha=crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');assert.equal(sha,'2ae4bf16821f5b86fbcdfaae66e7d18eb4b1e675','원본이 바뀌어 재검토가 필요합니다.');const pattern=/^function limit\(p,ms\)\{[^\n]*\}$/m;assert(before.match(pattern)?.[0].includes('clearTimeout(t)'));const replacement='function limit(p,ms){if(typeof setTimeout!=="function")return Promise.resolve(p);let settled=false;const timer=new Promise((_,bad)=>{setTimeout(()=>{if(!settled)bad(Error("요청 시간이 길어 중단했습니다. 잠시 뒤 다시 시도해 주세요."))},ms)});return Promise.race([Promise.resolve(p),timer]).finally(()=>{settled=true})}';await check(replacement);const oldPause="if(pause)await new Promise(r=>setTimeout(r,pause));",newPause="if(pause&&typeof setTimeout==='function')await new Promise(r=>setTimeout(r,pause));";assert.equal(before.split(oldPause).length,2);const after=before.replace(pattern,replacement).replace(oldPause,newPause).replace(/version:\s*["']1\.0\.9["']/,'version:"1.0.10"');assert(!after.includes('clearTimeout('));const mask=s=>s.replace(pattern,'TIMER').replace(newPause,oldPause).replace(/version:\s*["']1\.0\.(?:9|10)["']/,'VERSION');assert.equal(mask(before),mask(after),'타이머·페이지 대기 호환성·버전 외 변경 금지');const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463291);assert(row&&row.version==='1.0.9');row.version='1.0.10';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom.js?v=1.0.10';const notes=JSON.parse(fs.readFileSync('changelog.json','utf8'));notes.items.tvroom.unshift({d:'2026-11-08',t:'1.0.10: 공통 시간 제한의 clearTimeout 미지원 오류 수정. setTimeout도 없으면 통신 자체 timeout 사용·페이지 간 대기 생략. 재생·키 처리·프록시 유지. 취소 함수 없는 환경 등 모의 검사 13개 통과. 실기기 확인 전.'});const rows=[];for(const[k,list]of Object.entries(notes.items))for(const n of list)rows.push({name:notes.names?.[k]||k,...n});rows.sort((a,b)=>String(b.d).localeCompare(String(a.d)));const md=['# 업데이트 내역','','확장별 수정 이력입니다.',''];let day='';for(const n of rows){if(day!==n.d){day=n.d;md.push('## '+day,'')}md.push('- '+n.name+': '+n.t)}fs.writeFileSync(file,after);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync('업데이트내역.md',md.join('\n')+'\n');fs.appendFileSync('tools/tvroom-common-checklist.md','\n## 1.0.10 타이머 호환성 수정\n\nclearTimeout을 사용하지 않습니다. setTimeout도 없으면 통신 자체 timeout을 사용하고 페이지 간 인위적 대기를 생략합니다. 취소 함수 없음·Promise형 타이머·타이머 모두 없음 환경에서 검사 13개를 통과했습니다. 원본 재생·키·프록시 등 다른 코드는 변경하지 않습니다. 실기기 검증은 별도입니다.\n');console.log('티비룸 타이머 호환성 검사 13개 통과·1.0.10 갱신')})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: 검사된 수정만 반영
        run: |
          node --check anime/tvroom.js
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- anime/tvroom.js index.json changelog.json 업데이트내역.md tools/tvroom-common-checklist.md
          git diff --cached --check
          git commit -m "티비룸 1.0.10 타이머 미지원 오류 수정·재생 유지"
          git push origin HEAD:main
