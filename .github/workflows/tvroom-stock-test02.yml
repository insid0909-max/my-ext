name: Tvroom stock test 02
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test02.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == '티비룸 순정 호환시험 0.0.2 진단 수정 준비'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process'),vm=require('node:vm');const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'ccd7c3304b0cba564bd8ca3f8d166c8023fffd8d');assert.equal(hash(fs.readFileSync(main,'utf8')),'b4c101b4f0ec16f0cf6f0cd8a6deb5d8a743cbf1');let out=before;const a=out.indexOf('const persist=s=>'),b=out.indexOf('const reason=e=>',a);assert(a>=0&&b>a);
          const helpers=String.raw`let memory02='';
          const persist=s=>{memory02=String(s);try{if(typeof SharedPreferences!=='function')return;const p=new SharedPreferences();if(typeof p.setString==='function')p.setString('tvroom_stock_test02_last',memory02);}catch(_){}};
          const last=()=>{if(memory02)return memory02;try{if(typeof SharedPreferences==='function'){const p=new SharedPreferences();let v='';if(typeof p.getString==='function')v=p.getString('tvroom_stock_test02_last','');else if(typeof p.get==='function')v=p.get('tvroom_stock_test02_last');if(typeof v==='string'&&v)return v;}}catch(_){}return 'まだ'.replace('まだ','아직 기록 없음 · 회차를 누르면 진단창에 결과를 직접 표시합니다.');};
          `;out=out.slice(0,a)+helpers+out.slice(b);
          const old='return result;}catch(e){const report=';assert.equal(out.split(old).length,2);out=out.replace(old,"throw Object.assign(Error(last()+' | 진단을 위해 재생 전 의도적으로 중단했습니다.'),{stockDiagnostic02:true});}catch(e){if(e&&e.stockDiagnostic02)throw e;const report=");out=out.replaceAll('시험 0.0.1','시험 0.0.2').replaceAll('진단판 0.0.1','진단판 0.0.2');assert(out.includes('version:\"0.0.1\"'));out=out.replace('version:\"0.0.1\"','version:\"0.0.2\"');
          fs.writeFileSync(p+'.check.js',out);cp.execFileSync(process.execPath,['--check',p+'.check.js']);fs.unlinkSync(p+'.check.js');const pref={},api=vm.runInNewContext('(()=>{'+helpers+';return {persist,last};})()',{SharedPreferences:class{getString(k,d){return pref[k]||d;}setString(k,v){pref[k]=v;}}});assert(api.last().includes('아직 기록 없음'));api.persist('진단 성공');assert.equal(api.last(),'진단 성공');assert.equal(pref.tvroom_stock_test02_last,'진단 성공');const missing=vm.runInNewContext('(()=>{'+helpers+';return {persist,last};})()');assert(missing.last().includes('아직 기록 없음'));missing.persist('저장소 없어도 직접 표시');assert.equal(missing.last(),'저장소 없어도 직접 표시');
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.1');row.version='0.0.2';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.2';row.notes='진단 전용: 회차 실행 시 재생 대신 결과창 표시. 저장소 미지원 시에도 직접 표시. 기존 티비룸은 변경 없음.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(hash(fs.readFileSync(main,'utf8')),'b4c101b4f0ec16f0cf6f0cd8a6deb5d8a743cbf1');
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m '티비룸 순정 호환시험 0.0.2 진단 직접 표시 [skip ci]'
          git push origin HEAD:main
