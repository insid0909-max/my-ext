name: Tvroom stock test 06
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvroom-stock-test06.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Prepare tvroom stock 0.0.6 resource probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),vm=require('node:vm');
          const p='anime/tvroom_stock_test.js',main='anime/tvroom.js',before=fs.readFileSync(p,'utf8'),original=fs.readFileSync(main,'utf8'),hash=s=>crypto.createHash('sha1').update('blob '+Buffer.byteLength(s)+'\0').update(s).digest('hex');assert.equal(hash(before),'c78e4c221e59e66402be61e2d4932f79db0bcea6');
          const marker="}catch(e){save('0.0.5 별도 사전검사: 로컬 요청 실패";assert.equal(before.split(marker).length,2);
          const probe=String.raw`
          if(Number(r.statusCode)===200&&ok&&/#EXTINF:/.test(body)){
          const origin=/^http:\/\/127\.0\.0\.1:\d+/.exec(local.url)[0];
          function resolve(uri){
          uri=String(uri||'').trim();if(!uri)return '';
          if(typeof URL==='function'){try{return new URL(uri,local.url).href}catch(_){return ''}}
          if(/^https?:\/\//i.test(uri))return uri;if(uri.startsWith('//'))return 'http:'+uri;if(/^[a-z][a-z0-9+.-]*:/i.test(uri))return '';
          const path=uri.startsWith('/')?uri:local.url.slice(origin.length).split(/[?#]/)[0].replace(/[^/]*$/,'')+uri,parts=[];for(const part of path.split('/')){if(part==='..')parts.pop();else if(part&&part!=='.')parts.push(part)}return origin+'/'+parts.join('/');
          }
          const keyLine=lines.find(x=>x.startsWith('#EXT-X-KEY:'))||'',mapLine=lines.find(x=>x.startsWith('#EXT-X-MAP:'))||'',uriOf=x=>/URI="([^"]+)"/.exec(x)?.[1]||'',segment=lines.find(x=>x.trim()&&!x.trim().startsWith('#'))||'';
          const jobs=[['키',uriOf(keyLine),false],['초기화',uriOf(mapLine),true],['첫조각',segment,true]],report=[read()];
          for(const [name,uri,partial] of jobs){
          if(!uri){report.push(name+' 없음');continue}
          if(partial&&/#EXT-X-BYTERANGE:|#EXT-X-MAP:[^\n]*BYTERANGE=/.test(body)){report.push(name+' 건너뜀(바이트범위 목록)');continue}
          const target=resolve(uri);if(!target.startsWith(origin+'/')){report.push(name+' 건너뜀(동일 로컬 프록시 주소 아님)');continue}
          try{const response=await c.get(target,{...(local.headers||{}),...(partial?{Range:'bytes=0-1023'}:{})}),headers=response.headers||{},length=Object.entries(headers).find(([k])=>k.toLowerCase()==='content-length')?.[1],n=String(length||'');report.push(name+' HTTP '+Number(response.statusCode)+' · 선언길이 '+(/^\d+$/.test(n)?n:'미제공')+(partial?' · 부분요청':'')+' · 바이트 검증 안함')}catch(e){report.push(name+' 요청실패 '+(/timeout|timed out|시간/i.test(String(e))?'시간초과':'클라이언트오류'))}
          }
          save(report.join(' | ')+' | 키 복원·복호화·플레이어 재생 미검사');
          }
          `;
          const out=before.replace(marker,probe+marker).replaceAll('0.0.5','0.0.6');new vm.Script(out);
          async function test(){
          class Extension{};Extension.prototype.getVideoList=async()=>[{url:'http://127.0.0.1:1234/list',headers:{}}];Extension.prototype.getFilterList=()=>[];Extension.prototype.getDetail=async()=>({description:''});let calls=[];
          const context={DefaultExtension:Extension,SharedPreferences:class{get(){return ''}setString(){}},Client:class{async get(u,h){calls.push([u,h]);return {statusCode:200,headers:{'content-length':'16'},body:u.endsWith('/list')?'#EXTM3U\n#EXT-X-KEY:METHOD=AES-128,URI="/key"\n#EXT-X-MAP:URI="/init"\n#EXTINF:4,\npart.ts':'test'}}}};vm.runInNewContext(out.slice(out.lastIndexOf(';(function(P){')),context);await assert.rejects(()=>new Extension().getVideoList('/test'),e=>['키 HTTP 200','초기화 HTTP 200','첫조각 HTTP 200','진단 전용'].every(s=>String(e.message).includes(s)));assert.equal(calls.length,4);assert.equal(calls[3][1].Range,'bytes=0-1023');
          const index=JSON.parse(fs.readFileSync('index.json','utf8')),row=index.find(x=>x.id===1230463292);assert(row);assert.equal(row.version,'0.0.5');row.version='0.0.6';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/my-ext/main/anime/tvroom_stock_test.js?v=0.0.6';row.notes='진단 전용: 동일 로컬 프록시의 키·초기화·첫 영상조각 최대 각 1건 응답 확인 후 직접 결과창 표시·재생 중단. 영상은 1024바이트 Range 요청이나 서버가 무시하면 전체 조각을 받을 수 있음. 선언길이는 실수신 바이트 수가 아님. 키·주소·본문 기록 안함. 기존 티비룸·키 처리 유지.';fs.writeFileSync(p,out);fs.writeFileSync('index.json',JSON.stringify(index,null,2)+'\n');assert.equal(fs.readFileSync(main,'utf8'),original);
          }test().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          git config user.name 'insid0909-max'
          git config user.email '266083559+insid0909-max@users.noreply.github.com'
          git add anime/tvroom_stock_test.js index.json
          git diff --cached --check
          git commit -m 'Tvroom stock 0.0.6 local resource diagnostic [skip ci]'
          git push origin HEAD:main
